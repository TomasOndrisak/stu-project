<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gauges</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .gauge-card {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease;
        }

        .gauge-card:hover {
            transform: translateY(-2px);
        }

        .gauge-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }
    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-md navbar-dark bg-dark py-2">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">

            <div class="d-flex flex-column flex-sm-row align-items-center gap-2 gap-sm-4 text-center text-sm-start">
                <span class="navbar-brand mb-0 h1">Dashboard</span>
                <ul class="navbar-nav flex-row gap-3">
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="/"><i
                                class="fa-solid fa-chart-line me-1"></i>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/gauges"><i class="fa-solid fa-gauge me-1"></i>Gauges</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="/history"><i
                                class="fa-solid fa-clock-rotate-left me-1"></i>History</a>
                    </li>
                </ul>
            </div>

            <div class="d-flex flex-wrap justify-content-center align-items-center gap-2">
                <span id="system-state" class="badge bg-secondary fs-7 fw-normal" style="font-size: 0.85rem;">● System
                    —</span>
                <span id="arduino-status" class="badge bg-secondary fs-7 fw-normal" style="font-size: 0.85rem;">●
                    Arduino Connecting...</span>
                <span class="navbar-text text-light py-0" id="status" style="font-size: 0.85rem;">● Server
                    Connecting...</span>
            </div>

        </div>
    </nav>

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-baseline mb-4 flex-wrap gap-2">
            <div>
                <p class="text-muted small mb-0">Real-time display of physical and control variables.</p>
            </div>
            <div class="text-muted small">
                <span>Last update:</span>
                <span id="last-update-abs" class="fw-semibold text-dark">—</span>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-3">
                <div class="gauge-card text-center p-3">
                    <h6 class="text-muted mb-1">Cold (output)</h6>
                    <div class="gauge-wrapper">
                        <canvas id="gauge-cold"></canvas>
                    </div>
                    <p class="fs-4 fw-bold text-primary mb-0"><span id="val-cold">—</span> °C</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="gauge-card text-center p-3">
                    <h6 class="text-muted mb-1">Warm (input)</h6>
                    <div class="gauge-wrapper">
                        <canvas id="gauge-warm"></canvas>
                    </div>
                    <p class="fs-4 fw-bold text-danger mb-0"><span id="val-warm">—</span> °C</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="gauge-card text-center p-3">
                    <h6 class="text-muted mb-1">Peltier PWM</h6>
                    <div class="gauge-wrapper">
                        <canvas id="gauge-peltier"></canvas>
                    </div>
                    <p class="fs-4 fw-bold text-warning mb-0"><span id="val-peltier">—</span></p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="gauge-card text-center p-3">
                    <h6 class="text-muted mb-1">Flow Rate</h6>
                    <div class="gauge-wrapper">
                        <canvas id="gauge-flow"></canvas>
                    </div>
                    <p class="fs-4 fw-bold text-info mb-0"><span id="val-flow">—</span> LPM</p>
                </div>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-gauges@2.1.7/gauge.min.js"></script>
    <script src="/static/js/gauges.js" defer></script>
</body>

</html>
