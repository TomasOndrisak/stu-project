<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISA Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">MISA Dashboard</span>
            <div class="d-flex align-items-center gap-3">
                <span id="arduino-status" class="badge bg-secondary fs-6 fw-normal">● Arduino Connecting...</span>
                <span class="navbar-text text-light" id="status">● Server Connecting...</span>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row g-3 mb-4">
            <div class="col-12 col-lg-6">
                <h2 class="h6 mb-2">Teploty</h2>
                <div class="card">
                    <div class="card-body" style="height: 250px;">
                        <canvas id="chart-temperatures"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-6">
                <h2 class="h6 mb-2">Regulačná odchýlka</h2>
                <div class="card">
                    <div class="card-body" style="height: 250px;">
                        <canvas id="chart-error"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="h5 mb-3 mt-4">Aktuálne hodnoty</h2>

        <div class="row g-3">
            <div class="col-6 col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Cold</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-cold">—</span> °C</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Warm</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-warm">—</span> °C</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Setpoint</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-setpoint">—</span> °C</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Error</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-error">—</span> °C</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3 mt-1">
            <div class="col-6 col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Peltier</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-peltier">—</span></p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Pump</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-pump">—</span></p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Heater</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-heater">—</span></p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Resistance</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-resistance">—</span></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3 mt-1">
            <div class="col-12 col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">P term</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-p-term">—</span></p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">I term</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-i-term">—</span></p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">D term</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-d-term">—</span></p>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="h5 mb-3 mt-4">Ovládanie</h2>
        <div class="card">
            <div class="card-body">

                <div class="mb-3">
                    <label for="ctrl-setpoint" class="form-label">
                        Setpoint: <span id="ctrl-setpoint-value">22.0</span> °C
                    </label>
                    <input type="range" class="form-range" id="ctrl-setpoint" min="16" max="32" step="0.5" value="22">
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label for="ctrl-pump" class="form-label mb-0">
                            Pump PWM: <span id="ctrl-pump-value">128</span>
                        </label>
                        <div class="form-check form-switch mb-0">
                            <input class="form-check-input" type="checkbox" id="ctrl-pump-pot">
                            <label class="form-check-label" for="ctrl-pump-pot">Potenciometer</label>
                        </div>
                    </div>
                    <input type="range" class="form-range" id="ctrl-pump" min="0" max="255" step="1" value="128">
                </div>

                <div class="mb-3">
                    <label for="ctrl-heater" class="form-label">
                        Heater PWM: <span id="ctrl-heater-value">128</span>
                    </label>
                    <input type="range" class="form-range" id="ctrl-heater" min="0" max="255" step="1" value="128">
                </div>

                <hr>
                <h6 class="mb-3">PID parametre</h6>
                <div class="row g-2 mb-3">
                    <div class="col">
                        <label for="ctrl-kp" class="form-label">Kp</label>
                        <input type="number" class="form-control" id="ctrl-kp" value="100" step="0.1">
                    </div>
                    <div class="col">
                        <label for="ctrl-ki" class="form-label">Ki</label>
                        <input type="number" class="form-control" id="ctrl-ki" value="5.5" step="0.1">
                    </div>
                    <div class="col">
                        <label for="ctrl-kd" class="form-label">Kd</label>
                        <input type="number" class="form-control" id="ctrl-kd" value="0" step="0.1">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" id="ctrl-pid-apply">Apply PID</button>
                    <button class="btn btn-outline-secondary" id="ctrl-pid-reset">Reset integral</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
    <script src="/static/js/dashboard.js"></script>
</body>

</html>
