<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISA Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">MISA Dashboard</span>
        <span class="navbar-text text-light" id="status">Connecting...</span>
    </div>
</nav>

<main class="container py-4">
    <h2 class="h5 mb-3">Teploty</h2>
    <p class="text-muted">Graf placeholder</p>

    <h2 class="h5 mb-3 mt-4">PID akčné členy</h2>
    <p class="text-muted">Graf placeholder</p>

   <h2 class="h5 mb-3 mt-4">Aktuálne hodnoty</h2>
<div class="row g-3">
    <div class="col-6 col-md-4 col-lg">
        <div class="card text-center">
            <div class="card-body">
                <h6 class="card-subtitle text-muted">Cold</h6>
                <p class="card-text fs-4 mb-0"><span id="val-cold">—</span> °C</p>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4 col-lg">
        <div class="card text-center">
            <div class="card-body">
                <h6 class="card-subtitle text-muted">Warm</h6>
                <p class="card-text fs-4 mb-0"><span id="val-warm">—</span> °C</p>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4 col-lg">
        <div class="card text-center">
            <div class="card-body">
                <h6 class="card-subtitle text-muted">Setpoint</h6>
                <p class="card-text fs-4 mb-0"><span id="val-setpoint">—</span> °C</p>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4 col-lg">
        <div class="card text-center">
            <div class="card-body">
                <h6 class="card-subtitle text-muted">Peltier</h6>
                <p class="card-text fs-4 mb-0"><span id="val-peltier">—</span></p>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4 col-lg">
        <div class="card text-center">
            <div class="card-body">
                <h6 class="card-subtitle text-muted">Pump</h6>
                <p class="card-text fs-4 mb-0"><span id="val-pump">—</span></p>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4 col-lg">
        <div class="card text-center">
            <div class="card-body">
                <h6 class="card-subtitle text-muted">Heater</h6>
                <p class="card-text fs-4 mb-0"><span id="val-heater">—</span></p>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4 col-lg">
        <div class="card text-center">
            <div class="card-body">
                <h6 class="card-subtitle text-muted">Resistance</h6>
                <p class="card-text fs-4 mb-0"><span id="val-resistance">—</span></p>
            </div>
        </div>
    </div>
</div>

    <h2 class="h5 mb-3 mt-4">Ovládanie</h2>
    <p class="text-muted">Formuláre budú tu.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
