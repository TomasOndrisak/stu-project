<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISA Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">MISA Dashboard</span>
            <span class="navbar-text text-light" id="status">Connecting...</span>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row g-3 mb-4">
            <div class="col-12 col-lg-6">
                <h2 class="h6 mb-2">Teploty</h2>
                <div class="card">
                    <div class="card-body" style="height: 250px;">
                        <canvas id="chart-temperatures"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-6">
                <h2 class="h6 mb-2">PID akčné členy</h2>
                <div class="card">
                    <div class="card-body" style="height: 250px;">
                        <canvas id="chart-actuators"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="h5 mb-3 mt-4">Aktuálne hodnoty</h2>
        <div class="row g-3">
            <div class="col-6 col-md-4 col-lg">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Cold</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-cold">—</span> °C</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Warm</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-warm">—</span> °C</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Setpoint</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-setpoint">—</span> °C</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Peltier</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-peltier">—</span></p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Pump</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-pump">—</span></p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Heater</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-heater">—</span></p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Resistance</h6>
                        <p class="card-text fs-4 mb-0"><span id="val-resistance">—</span></p>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="h5 mb-3 mt-4">Ovládanie</h2>
        <div class="card">
            <div class="card-body">
                <label for="ctrl-setpoint" class="form-label">
                    Setpoint: <span id="ctrl-setpoint-value">18.0</span> °C
                </label>
                <input type="range" class="form-range" id="ctrl-setpoint" min="16" max="30" step="0.5" value="18">
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>

</html>
